<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Thief — a stealth game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23ffd977'/></svg>">
<style>
  html, body { margin: 0; padding: 0; background: #0b120d; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #wrap { text-align: center; }
  canvas {
    display: block;
    width: 960px; height: 640px;
    background: #0b120d;
    border: 2px solid #3d3226;
    border-radius: 6px;
    image-rendering: pixelated;
  }
  p { color: #8a938a; font: 13px sans-serif; margin: 10px 0 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>
  <p>Lantern Thief — pocket every moon-lantern, then leave through the garden gate, unseen.</p>
</div>
<script type="module">
  import { startGame } from './src/main.js';
  startGame(document.getElementById('game'));
</script>
</body>
</html>
